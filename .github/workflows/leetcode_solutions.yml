name: Sync LeetCode Solutions

on:
  # Run manually from GitHub Actions
  workflow_dispatch:

  # Run every day at 12:00 AM IST
  # 12:00 AM IST = 18:30 UTC
  schedule:
    - cron: "30 18 * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      # 1. Get your repository
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Install Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 3. Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      # 4. Run custom LeetCode synchronizer
      - name: Sync LeetCode
        env:
          LEETCODE_SESSION: ${{ secrets.SECRET_2 }}
          LEETCODE_CSRF_TOKEN: ${{ secrets.SECRET_3 }}
          GITHUB_TOKEN: ${{ secrets.SECRET_1 }}
        run: |
          python scripts/sync_leetcode.py

      # 5. Configure Git
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # 6. Commit and push new solutions
      - name: Commit and Push
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git add .
            git commit -m "Sync LeetCode solutions"
            git push
          else
            echo "No new solutions to sync."
          fi