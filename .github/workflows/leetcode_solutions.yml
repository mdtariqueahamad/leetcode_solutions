name: Sync LeetCode Solutions

on:
  workflow_dispatch:
  schedule:
    # Runs daily at 12:00 AM IST (18:30 UTC)
    - cron: "30 18 * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Configure Git identity
        run: |
          git config user.name "mdtariqeahmad"
          git config user.email "mdtariqeahmad@users.noreply.github.com"

      - name: Run Sync Script
        env:
          LEETCODE_SESSION: ${{ secrets.SECRET_2 }}
          LEETCODE_CSRF_TOKEN: ${{ secrets.SECRET_3 }}
        run: |
          python .github/scripts/sync_leetcode.py

      - name: Commit and Push changes
        run: |
          git add .
          git diff --quiet && git diff --staged --quiet || (git commit -m "Sync LeetCode solutions" && git push)
