name: Sync LeetCode Solutions

on:
  schedule:
    - cron: "0 0 * * *" # Runs every day at midnight UTC
  workflow_dispatch:    # Allows manual trigger from GitHub UI

permissions:
  contents: write       # CRITICAL: Allows the Action to push code without needing a Personal Access Token

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests

      - name: Run LeetCode Sync Script
        env:
          LEETCODE_SESSION: ${{ secrets.SECRET_2 }}
          LEETCODE_CSRF_TOKEN: ${{ secrets.SECRET_3 }}
        run: python .github/scripts/sync_leetcode.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Stage all new folders and files created at the repository root
          git add .
          
          # Check if there are actually any new files staged
          if git diff --cached --quiet; then
            echo "No changes to commit (no new problems solved)."
          else
            git commit -m "Auto-sync newly solved LeetCode problems"
            git push
          fi
