name: Sync LeetCode Solutions

on:
  workflow_dispatch:
  schedule:
    - cron: '30 18 * * *'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Sync LeetCode submissions
        env:
          LEETCODE_SESSION: ${{ secrets.SECRET_2 }}
          LEETCODE_CSRF_TOKEN: ${{ secrets.SECRET_3 }}
          GITHUB_TOKEN: ${{ secrets.SECRET_1 }}
        run: python scripts/sync_leetcode.py